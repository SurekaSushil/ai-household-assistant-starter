[project]
name = "ai-household-assistant"
version = "0.1.0"
description = "A beginner-friendly FastAPI app that talks to a local Ollama model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pypdf>=6.14.2",
    "pywin32>=312",
    "qdrant-client>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
